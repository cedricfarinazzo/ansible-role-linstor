---
- name: Configuration directory exists
  ansible.builtin.file:
    path: "{{ linstor_conf_dir }}"
    state: directory
    owner: root
    mode: "0755"
  register: linstor_conf_dir_made

# The files hold the store password: root and the controller's group (set by its unit) only. Check mode on a fresh
# host has no directory to write in
- name: Satellite configuration
  ansible.builtin.template:
    src: linstor_satellite.toml.j2
    dest: "{{ linstor_satellite_conf }}"
    owner: root
    mode: "0640"
  # Holds the store password: never in --diff output or a task result
  diff: false
  no_log: true
  notify: Restart LINSTOR
  when: linstor_satellite and not (ansible_check_mode and linstor_conf_dir_made is changed)

- name: Controller configuration
  ansible.builtin.template:
    src: linstor.toml.j2
    dest: "{{ linstor_controller_conf }}"
    owner: root
    mode: "0640"
  diff: false
  no_log: true
  notify: Restart LINSTOR
  when: linstor_controller and not (ansible_check_mode and linstor_conf_dir_made is changed)

# No group: under /etc/linstor the controller unit sets it at each start
- name: Client configuration directory exists
  ansible.builtin.file:
    path: "{{ linstor_client_config | dirname }}"
    state: directory
    owner: root
    mode: "0755"
  register: linstor_client_dir
  when: linstor_client

- name: Client configuration
  ansible.builtin.template:
    src: linstor-client.conf.j2
    dest: "{{ linstor_client_config }}"
    owner: root
    mode: "0644"
  when: linstor_client and not (ansible_check_mode and linstor_client_dir is changed)

- name: Drop-ins of the LINSTOR services
  ansible.builtin.include_tasks: dropins.yml

# Only the runtime masks install.yml sets (a rerun after a failed run finds them too), never a user's own mask;
# before ha.yml, which cannot disable a masked unit
- name: Lift the install-time masks now the configuration is in place
  ansible.builtin.shell: |
    set -euo pipefail
    for u in {{ linstor_service_packages | join(' ') }}; do
      if [ "$(systemctl is-enabled "$u.service" 2>/dev/null || true)" = masked-runtime ]; then
        systemctl unmask --runtime "$u.service"
        echo "$u"
      fi
    done
  args:
    executable: /bin/bash
  register: linstor_unmasked
  changed_when: linstor_unmasked.stdout | length > 0

- name: Controller HA units
  ansible.builtin.include_tasks: ha.yml

# Check mode on a fresh host: the packages are not installed, so their units are unknown
- name: Services are enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ linstor_services }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart on changed files before talking to the controller
  ansible.builtin.meta: flush_handlers

# Under HA only the node drbd-reactor started the controller on talks to it; the others skip the API
- name: Find whether the controller runs here
  ansible.builtin.systemd_service:
    name: linstor-controller
  register: linstor_controller_state
  failed_when: false
  check_mode: false
  when: linstor_ha_controller

- name: Controller connectors
  ansible.builtin.include_tasks: connectors.yml
  when: linstor_controller and linstor_controller_here

- name: Cluster objects
  ansible.builtin.include_tasks: cluster.yml
  when: linstor_cluster and linstor_controller_here
