---
# No source of its own: LINSTOR comes from the sources already configured (LINBIT's, a mirror, Proxmox VE).
# Check mode reports a stale cache as changed without refreshing it: only a real refresh counts.
- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: linstor_cache_refresh
  changed_when: linstor_cache_refresh.cache_updated and not ansible_check_mode

- name: Read the package candidates
  ansible.builtin.command: apt-cache policy {{ linstor_packages | join(' ') }}
  register: linstor_policy
  changed_when: false
  check_mode: false

- name: Every package has a source
  ansible.builtin.assert:
    that:
      - linstor_missing | length == 0
    fail_msg: >-
      No configured APT source provides {{ linstor_missing | join(', ') }}. Add LINBIT's repository first (for example
      with the cedricfarinazzo.drbd role, whose LINBIT source carries LINSTOR) or your mirror.
    quiet: true
  vars:
    # "apt-cache policy" prints "Candidate: (none)" or nothing for an unknown package
    linstor_known: >-
      {{ linstor_policy.stdout | regex_findall('(?m)^(\S+):\n\s+Installed: .*\n\s+Candidate: (?!\(none\))') }}
    linstor_missing: "{{ linstor_packages | difference(linstor_known) }}"

# A postinst starts its new service at once with the package's defaults: the controller's writes a linstor.toml with
# H2 user "linstor", creates the database with it and serves plain HTTP on every address. Masked for this boot until
# config.yml lifts the mask, so the first start has the role's files
- name: Read which LINSTOR services are installed
  ansible.builtin.command: >-
    dpkg-query -W -f '${Package} ${db:Status-Status}\n' {{ linstor_service_packages | join(' ') }}
  register: linstor_dpkg
  # 1 for a package dpkg never saw
  failed_when: linstor_dpkg.rc not in [0, 1]
  changed_when: false
  check_mode: false
  when: linstor_service_packages | length > 0

- name: New LINSTOR services stay stopped until the role's configuration is in place  # noqa: command-instead-of-module (mask --runtime: no module has it)
  ansible.builtin.command: systemctl mask --runtime {{ item }}.service
  loop: >-
    {{ linstor_service_packages
       | difference(linstor_dpkg.stdout | default('') | regex_findall('(?m)^(\S+) installed$')) }}
  changed_when: true

- name: LINSTOR packages are installed
  ansible.builtin.apt:
    name: "{{ linstor_packages }}"
    state: present
