---
# A wrong type here would write a different, valid config or open a port: check every input first.
- name: Settings are sound
  ansible.builtin.assert:
    that:
      - linstor_state in ['present', 'absent']
      - linstor_satellite is boolean and linstor_controller is boolean and linstor_client is boolean
      - linstor_state == 'absent' or linstor_satellite or linstor_controller or linstor_client
      - linstor_packages_extra is sequence and linstor_packages_extra is not string
      - linstor_packages_extra | map('string') | reject('match', '^[a-z0-9][a-z0-9.+-]+\Z') | list | length == 0
      - linstor_controller_db_connection_url is string
      - linstor_controller_db_connection_url is match('^((jdbc:|etcd://)[^\s"\\\\]+)?\Z')
      - linstor_controller_db_user is string and linstor_controller_db_user is match('^[^"\\\\\s]*\Z')
      # TOML basic string: no quote, backslash or control character (a newline would add a key)
      - linstor_controller_db_password is string and linstor_controller_db_password is match('^[^"\\\\\x00-\x1f\x7f]*\Z')
      - linstor_tls is boolean
      - linstor_tls_protocol in ['TLSv1.2', 'TLSv1.3']
      - linstor_tls_controller_certs is sequence and linstor_tls_controller_certs is not string
      - linstor_tls_controller_certs is not mapping
      - linstor_tls_controller_certs | length == 0 or linstor_tls
      - linstor_tls_controller_certs | map('string') | reject('match', '^/[A-Za-z0-9._/-]+\Z') | list | length == 0
      - linstor_tls_store_password is string
      - linstor_tls_store_password | length == 0 or linstor_tls_store_password is match('^[A-Za-z0-9._~+-]{12,}\Z')
      - linstor_satellite_bind_address is string and linstor_satellite_bind_address is match('^[0-9A-Fa-f:.]+\Z')
      - linstor_controller_http_listen is string and linstor_controller_http_listen is match('^[0-9A-Fa-f:.]+\Z')
      - linstor_controller_https_listen is string and linstor_controller_https_listen is match('^[0-9A-Fa-f:.]+\Z')
      - linstor_satellite_port | string is match('^[0-9]+\Z') and linstor_satellite_port | int in range(1, 65536)
      - linstor_controller_http_port | string is match('^[0-9]+\Z') and linstor_controller_http_port | int in range(1, 65536)
      - linstor_controller_https_port | string is match('^[0-9]+\Z') and linstor_controller_https_port | int in range(1, 65536)
      - linstor_controller_http_port | int != linstor_controller_https_port | int
      - linstor_controller_plain_connector is boolean
      - linstor_client_config is string and linstor_client_config is match('^/[A-Za-z0-9._/-]+\Z')
      - linstor_client_controllers is string
      - linstor_client_controllers is match('^(linstor(\+ssl)?://[A-Za-z0-9.:\[\]-]+(:[0-9]+)?(,linstor(\+ssl)?://[A-Za-z0-9.:\[\]-]+(:[0-9]+)?)*)?\Z')
      - linstor_cluster is boolean
      - not linstor_cluster or linstor_controller
      - linstor_api_url is string and linstor_api_url is match('^(https?://[A-Za-z0-9.:\[\]-]+(:[0-9]+)?)?\Z')
      - linstor_wait_retries | string is match('^[0-9]+\Z') and linstor_wait_retries | int > 0
      - linstor_remove_data is boolean
      - linstor_nodes is sequence and linstor_nodes is not string and linstor_nodes is not mapping
      - linstor_storage_pools is sequence and linstor_storage_pools is not string and linstor_storage_pools is not mapping
      - linstor_resource_groups is sequence and linstor_resource_groups is not string
      - linstor_resource_groups is not mapping
    fail_msg: >-
      linstor_state present|absent; linstor_satellite, linstor_controller, linstor_client booleans, one true;
      linstor_packages_extra a list of package names; linstor_controller_db_connection_url '' or a jdbc: or etcd://
      URL; linstor_tls a boolean; linstor_tls_protocol TLSv1.2|TLSv1.3; linstor_tls_controller_certs a list of absolute PEM paths, with linstor_tls;
      linstor_tls_store_password '' or 12+ of [A-Za-z0-9._~+-]; listen addresses IP literals; ports 1-65535, HTTP and HTTPS apart;
      linstor_controller_plain_connector, linstor_cluster (controller only) and linstor_remove_data booleans;
      linstor_client_config an absolute path; linstor_client_controllers '' or linstor[+ssl]:// URLs;
      linstor_api_url '' or an http(s) URL without a path; linstor_wait_retries above 0; linstor_nodes,
      linstor_storage_pools and linstor_resource_groups lists
    quiet: true

- name: TLS files are named
  ansible.builtin.assert:
    that:
      - item is string and item is match('^/[A-Za-z0-9._/-]+\Z')
    fail_msg: linstor_tls needs linstor_tls_cert, linstor_tls_key and linstor_tls_ca, absolute paths of PEM files on the host
    quiet: true
  loop:
    - "{{ linstor_tls_cert }}"
    - "{{ linstor_tls_key }}"
    - "{{ linstor_tls_ca }}"
  when: linstor_state == 'present' and linstor_tls

- name: Each node is well formed
  ansible.builtin.assert:
    that:
      - item is mapping and item.keys() | difference(['name', 'address', 'type', 'encryption', 'port']) | length == 0
      - item.name is defined and item.name is string and item.name is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,47}\Z')
      - item.address is defined and item.address is string and item.address is match('^[0-9A-Fa-f:.]+\Z')
      - item.type | default('satellite') in linstor_node_types
      - item.encryption | default('ssl') in ['ssl', 'plain']
      - item.port | default(3366) | string is match('^[0-9]+\Z') and item.port | default(3366) | int in range(1, 65536)
      - linstor_nodes | map(attribute='name') | select('equalto', item.name) | list | length == 1
      - item.encryption | default('ssl' if linstor_tls else 'plain') == 'ssl' or linstor_controller_plain_connector
    fail_msg: >-
      {{ item.name | default('?') }}: keys name (host name), address (IP), type satellite|combined|controller|auxiliary,
      encryption ssl|plain (plain needs linstor_controller_plain_connector), port; a unique name
    quiet: true
  loop: "{{ linstor_nodes }}"
  loop_control:
    label: "{{ item.name | default(item) }}"
  when: linstor_state == 'present'

- name: Each storage pool is well formed
  ansible.builtin.assert:
    that:
      - item is mapping and item.keys() | difference(['name', 'node', 'provider', 'pool', 'properties']) | length == 0
      - item.name is defined and item.name is string and item.name is match('^[A-Za-z][A-Za-z0-9_-]{0,47}\Z')
      - item.node is defined and item.node is string and item.node is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,47}\Z')
      - item.provider is defined and item.provider | lower in linstor_providers
      - (item.provider | lower == 'diskless') == (item.pool is not defined)
      - item.pool is not defined or (item.pool is string and item.pool is match('^[A-Za-z0-9/._-]+\Z'))
      - item.properties | default({}) is mapping
      - item.properties | default({}) | dict2items | map(attribute='key') | reject('match', '^[A-Za-z0-9/_.-]+\Z')
        | list | length == 0
      # A control character in a value would smuggle a second line into the request or the CLI
      - item.properties | default({}) | dict2items | map(attribute='value') | map('string')
        | reject('match', '^[^\x00-\x1f\x7f]*\Z') | list | length == 0
      - linstor_storage_pools | selectattr('name', 'equalto', item.name) | selectattr('node', 'equalto', item.node)
        | list | length == 1
    fail_msg: >-
      {{ item.name | default('?') }}: keys name, node, provider lvm|lvm_thin|zfs|zfs_thin|file|file_thin|diskless,
      pool (vg, vg/thinpool, zpool or directory; none for diskless), properties (mapping); one per name and node
    quiet: true
  loop: "{{ linstor_storage_pools }}"
  loop_control:
    label: "{{ item.name | default(item) }}"
  when: linstor_state == 'present'

- name: Each resource group is well formed
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.keys() | difference(['name', 'place_count', 'storage_pools', 'drbd_options', 'properties', 'description'])
        | length == 0
      - item.name is defined and item.name is string and item.name is match('^[A-Za-z][A-Za-z0-9_-]{0,47}\Z')
      - item.place_count is not defined or (item.place_count | string is match('^[0-9]+\Z') and item.place_count | int > 0)
      - item.storage_pools | default([]) is sequence and item.storage_pools | default([]) is not string
      - item.storage_pools | default([]) | map('string') | reject('match', '^[A-Za-z][A-Za-z0-9_-]{0,47}\Z') | list | length == 0
      - item.drbd_options | default({}) is mapping and item.properties | default({}) is mapping
      - (item.drbd_options | default({}) | dict2items + item.properties | default({}) | dict2items)
        | map(attribute='key') | reject('match', '^[A-Za-z0-9/_.-]+\Z') | list | length == 0
      - (item.drbd_options | default({}) | dict2items + item.properties | default({}) | dict2items)
        | map(attribute='value') | map('string') | reject('match', '^[^\x00-\x1f\x7f]*\Z') | list | length == 0
      - item.drbd_options | default({}) | dict2items | map(attribute='key') | select('match', '^DrbdOptions/') | list | length == 0
      - item.description | default('') is string and item.description | default('') is match('^[^\x00-\x1f\x7f]*\Z')
      - linstor_resource_groups | map(attribute='name') | select('equalto', item.name) | list | length == 1
    fail_msg: >-
      {{ item.name | default('?') }}: keys name, place_count (above 0), storage_pools (list), drbd_options (keys
      without the DrbdOptions/ prefix, e.g. PeerDevice/c-max-rate), properties (mapping), description; a unique name
    quiet: true
  loop: "{{ linstor_resource_groups }}"
  loop_control:
    label: "{{ item.name | default(item) }}"
  when: linstor_state == 'present'
