---
# Before any package or LINSTOR file: a bad certificate stops the role with the host untouched.
- name: OpenSSL is installed
  ansible.builtin.apt:
    name: openssl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check the certificate, its key and its CA
  ansible.builtin.shell: |
    set -uo pipefail
    for f in {{ linstor_tls_cert | quote }} {{ linstor_tls_key | quote }} {{ linstor_tls_ca | quote }}; do
      [ -r "$f" ] || { echo "missing: $f"; exit 1; }
    done
    c=$(openssl x509 -noout -pubkey -in {{ linstor_tls_cert | quote }} 2>&1) || { echo "not a PEM certificate: $c"; exit 1; }
    k=$(openssl pkey -pubout -in {{ linstor_tls_key | quote }} 2>&1) || { echo "not a PEM private key without passphrase"; exit 1; }
    [ "$c" = "$k" ] || { echo "the key does not match the certificate"; exit 1; }
    openssl x509 -noout -checkend 0 -in {{ linstor_tls_cert | quote }} > /dev/null || { echo "the certificate has expired"; exit 1; }
    openssl verify -CAfile {{ linstor_tls_ca | quote }} {{ linstor_tls_cert | quote }} > /dev/null 2>&1 ||
      { echo "the certificate is not signed by the CA"; exit 1; }
  args:
    executable: /bin/bash
  register: linstor_cert_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: The certificate is usable
  ansible.builtin.assert:
    that:
      - linstor_cert_check.rc == 0
    fail_msg: >-
      linstor_tls_cert {{ linstor_tls_cert }}, linstor_tls_key {{ linstor_tls_key }}, linstor_tls_ca {{ linstor_tls_ca }}:
      {{ linstor_cert_check.stdout | default('') }}. Nothing was changed.
    quiet: true

# Its own certificate checked first; the copy is checked with the other pins below
- name: Read the controller's certificate
  ansible.builtin.slurp:
    src: "{{ hostvars[linstor_tls_controller_cert_from].linstor_tls_cert }}"
  # delegate_to is resolved before when: an empty name fails even a skipped task
  delegate_to: "{{ linstor_tls_controller_cert_from or inventory_hostname }}"
  register: linstor_controller_pem
  when: linstor_controller_cert_copy_due

- name: Directory of the controller's certificate copy
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ ([linstor_tls_controller_cert_copy] + ([linstor_tls_controller_cert_previous]
        if linstor_tls_controller_cert_previous | length > 0 else [])) | map('dirname') | unique | list }}
  when: linstor_controller_cert_copy_due

# A renewed controller certificate reaches the satellite before the controller's own run restarts it, so the
# controller still presents the old one: the copy being replaced stays pinned, while valid, until the next run
- name: Is the copy being replaced still a usable pin
  ansible.builtin.shell: |
    set -uo pipefail
    c={{ linstor_tls_controller_cert_copy | quote }}
    if [ ! -s "$c" ] || cmp -s "$c" -; then echo drop; exit 0; fi
    if openssl x509 -noout -checkend 0 -in "$c" > /dev/null 2>&1 &&
       openssl verify -CAfile {{ linstor_tls_ca | quote }} "$c" > /dev/null 2>&1; then echo keep; else echo drop; fi
  args:
    executable: /bin/bash
    stdin: "{{ linstor_controller_pem.content | b64decode }}"
    stdin_add_newline: false
  register: linstor_controller_previous_state
  changed_when: false
  check_mode: false
  when: linstor_controller_cert_copy_due and linstor_tls_controller_cert_previous | length > 0

- name: The copy being replaced, kept as the previous pin
  ansible.builtin.copy:
    src: "{{ linstor_tls_controller_cert_copy }}"
    remote_src: true
    dest: "{{ linstor_tls_controller_cert_previous }}"
    owner: root
    group: root
    mode: "0644"
  register: linstor_controller_previous_pem
  when: linstor_controller_previous_state.stdout | default('') == 'keep'

# A previous pin no longer kept is deleted after the trust store is rebuilt (stores.yml)
- name: Copy of the controller's certificate
  ansible.builtin.copy:
    content: "{{ linstor_controller_pem.content | b64decode }}"
    dest: "{{ linstor_tls_controller_cert_copy }}"
    owner: root
    group: root
    mode: "0644"
  register: linstor_controller_pem_copy
  when: linstor_controller_cert_copy_due

# A pinned controller certificate that is wrong would leave the satellite refusing its own controller. Check mode
# writes no copy: a copy or previous pin it would change is not on the host yet
- name: Check the controller certificates the satellite pins
  ansible.builtin.shell: |
    set -uo pipefail
    f={{ item | quote }}
    [ -r "$f" ] || { echo "missing: $f"; exit 1; }
    openssl x509 -noout -in "$f" > /dev/null 2>&1 || { echo "not a PEM certificate: $f"; exit 1; }
    openssl x509 -noout -checkend 0 -in "$f" > /dev/null || { echo "the certificate has expired: $f"; exit 1; }
    openssl verify -CAfile {{ linstor_tls_ca | quote }} "$f" > /dev/null 2>&1 ||
      { echo "not signed by the CA: $f"; exit 1; }
  args:
    executable: /bin/bash
  loop: >-
    {{ linstor_satellite_pins | reject('in',
         ([linstor_tls_controller_cert_copy] if ansible_check_mode and linstor_controller_pem_copy is changed else [])
         + ([linstor_tls_controller_cert_previous] if ansible_check_mode and linstor_controller_previous_pem is changed
            else [])) | list }}
  register: linstor_pin_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: linstor_satellite

- name: The controller certificates are usable
  ansible.builtin.assert:
    that:
      - linstor_pin_failed | length == 0
    fail_msg: >-
      linstor_tls_controller_certs: {{ linstor_pin_failed | map(attribute='stdout') | join('; ') }}.
      Nothing was changed.
    quiet: true
  vars:
    linstor_pin_failed: >-
      {{ linstor_pin_check.results | default([]) | rejectattr('skipped', 'defined')
         | rejectattr('rc', 'equalto', 0) | list }}
