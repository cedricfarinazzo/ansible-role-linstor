---
dependency:
  # Into the scenario's ephemeral directory, put on the roles path below; never ~/.ansible
  name: shell
  command: >-
    sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/collections.yml"
    && ansible-galaxy role install --force -r "$MOLECULE_SCENARIO_DIRECTORY/requirements.yml"
    -p "$MOLECULE_EPHEMERAL_DIRECTORY/roles"'
driver:
  name: docker
# Two nodes on one network: a combined node (controller and satellite) and a satellite
platforms:
  - name: linstor-a-${MOLECULE_DISTRO:-debian13}
    hostname: linstor-a
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: linstor-${MOLECULE_DISTRO:-debian13}
    groups:
      - controllers
  - name: linstor-b-${MOLECULE_DISTRO:-debian13}
    hostname: linstor-b
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: linstor-${MOLECULE_DISTRO:-debian13}
provisioner:
  name: ansible
  env:
    # Molecule does not add it: without it only a developer's ~/.ansible/roles hides the missing role
    ANSIBLE_ROLES_PATH: ${MOLECULE_EPHEMERAL_DIRECTORY}/roles
  playbooks:
    prepare: prepare/playbook.yml
    converge: converge/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
        linstor_tls: true
        linstor_tls_cert: /root/pki/node.crt
        linstor_tls_key: /root/pki/node.key
        linstor_tls_ca: /root/pki/ca.crt
        # Every satellite accepts the controller's certificate only, not the other node's of the same CA
        linstor_tls_controller_certs:
          - /root/pki/controller.crt
        # The satellite copies it from the controller; the controller itself copies nothing
        linstor_tls_controller_cert_from: "{{ molecule_controller }}"
        linstor_tls_controller_cert_copy: /root/pki/controller.crt
        molecule_controller: "{{ groups['controllers'] | first }}"
        molecule_node:
          name: "{{ ansible_facts.hostname }}"
          address: "{{ ansible_facts.default_ipv4.address }}"
          type: "{{ 'combined' if inventory_hostname in groups['controllers'] else 'satellite' }}"
      controllers:
        linstor_controller: true
        linstor_nodes: >-
          {{ groups['all'] | map('extract', hostvars)
             | map(attribute='molecule_node') | list }}
        linstor_storage_pools:
          - name: pool-file
            node: linstor-a
            provider: file_thin
            pool: /srv/linstor-pool
          - name: pool-file
            node: linstor-b
            provider: file_thin
            pool: /srv/linstor-pool
        linstor_resource_groups:
          - name: rg-two
            place_count: 2
            storage_pools:
              - pool-file
            drbd_options:
              PeerDevice/c-max-rate: 71680
              Net/tls: "yes"
verifier:
  name: ansible
scenario:
  name: cluster
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - destroy
