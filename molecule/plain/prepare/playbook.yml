---
- name: Prepare
  hosts: all
  tasks:
    - name: Tools are installed
      ansible.builtin.apt:
        name:
          - curl
          - iproute2
          - jq
        update_cache: true
        cache_valid_time: 3600

    # Only the source and key part of the DRBD role: no module build in a container
    - name: LINBIT source, its key checked against the pinned fingerprint
      ansible.builtin.include_role:
        name: cedricfarinazzo.drbd
        tasks_from: repo.yml

    # The image's policy-rc.d (exit 101) stops every postinst from starting its service; a real host starts it at
    # once, with the package's defaults: removed, so the scenarios install as a host does
    - name: Packages start their services on install, as on a host
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

    # Each start of a LINSTOR service records whether the role's file was in place ("role") or not ("package");
    # in /run, out of the role's and the absent checks' way
    - name: Drop-in directories of the LINSTOR services
      ansible.builtin.file:
        path: /run/systemd/system/{{ item }}.service.d
        state: directory
        mode: "0755"
      loop:
        - linstor-controller
        - linstor-satellite

    - name: Record the configuration each LINSTOR start finds
      ansible.builtin.copy:
        dest: /run/systemd/system/{{ item.unit }}.service.d/molecule-start.conf
        content: |
          [Service]
          ExecStartPre=+/bin/sh -c 'if grep -qs "Ansible managed" {{ item.conf }}; then echo role; \
            else echo package; fi >> /run/molecule-{{ item.unit }}-starts'
        mode: "0644"
      loop:
        - unit: linstor-controller
          conf: /etc/linstor/linstor.toml
        - unit: linstor-satellite
          conf: /etc/linstor/linstor_satellite.toml

    - name: Systemd reads the drop-ins
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Minimal images drop /usr/share/man: the JRE's postinst then fails on its man page link
    - name: Man page directory for the JRE's alternatives
      ansible.builtin.file:
        path: /usr/share/man/man1
        state: directory
        mode: "0755"

    - name: Directory of the file-backed pool
      ansible.builtin.file:
        path: /srv/linstor-pool
        state: directory
        mode: "0700"
