---
# Each service's drop-in holds its own JVM options, environment and restart policy, and the running JVM has them.
# Each check line ends in "|| fail": a shell task's status is its last command's only.
- name: The package never started LINSTOR with its own defaults
  hosts: all
  gather_facts: false
  tasks:
    - name: Every LINSTOR start had the role's configuration
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        for u in linstor-controller linstor-satellite; do
          f=/run/molecule-$u-starts
          [ -s $f ] || fail "$u never started"
          if grep -vx role $f; then fail "$u started without the role's file: $(tr '\n' ' ' < $f)"; fi
        done
      args:
        executable: /bin/bash
      changed_when: false

- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Each drop-in holds its own service's settings only
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        d=/etc/systemd/system
        c=$(grep -v '^#' $d/linstor-controller.service.d/50-linstor-role.conf) || fail "no controller drop-in"
        s=$(grep -v '^#' $d/linstor-satellite.service.d/50-linstor-role.conf) || fail "no satellite drop-in"
        [ "$c" = "$C" ] || fail "controller drop-in: $c"
        [ "$s" = "$S" ] || fail "satellite drop-in: $s"
      args:
        executable: /bin/bash
      environment:
        C: |-
          [Service]
          Environment="JAVA_OPTS={{ linstor_controller_java_opts }}"
          Environment=MALLOC_ARENA_MAX=2
          Restart=on-failure
          RestartSec=2s
        S: |-
          [Service]
          Environment="JAVA_OPTS={{ linstor_satellite_java_opts }}"
          Environment=LS_KEEP_RES=res-kept
          Environment=MALLOC_ARENA_MAX=3
          Restart=on-failure
          RestartSec=2s
      changed_when: false

    # LINSTOR's start script puts JAVA_OPTS after its own -Xmx: the last one is the JVM's
    - name: Each running JVM has its heap cap, GC, GC log and environment
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        check() {
          local u=$1 xmx=$2 arenas=$3 pid args env
          pid=$(systemctl show -P MainPID $u); [ "$pid" -gt 0 ] || fail "$u not running"
          args=$(tr '\0' ' ' < /proc/$pid/cmdline); env=$(tr '\0' '\n' < /proc/$pid/environ)
          [ "$(grep -o -- '-Xmx[^ ]*' <<<"$args" | tail -1)" = "$xmx" ] || fail "$u heap: $args"
          grep -qF -- ' -XX:+UseSerialGC ' <<<"$args" || fail "$u GC: $args"
          grep -qx "MALLOC_ARENA_MAX=$arenas" <<<"$env" || fail "$u MALLOC_ARENA_MAX: $(grep MALLOC <<<"$env")"
          systemctl show -P Environment $u | grep -qF -- "$xmx" || fail "$u unit environment: $(systemctl show -P Environment $u)"
          [ -s /var/log/$u/gc.log ] || fail "$u wrote no GC log"
        }
        check linstor-controller -Xmx320m 2
        check linstor-satellite -Xmx224m 3
        e=$(tr '\0' '\n' < /proc/$(systemctl show -P MainPID linstor-satellite)/environ)
        grep -qx LS_KEEP_RES=res-kept <<<"$e" || fail "satellite LS_KEEP_RES: $(grep LS_ <<<"$e")"
        if tr '\0' '\n' < /proc/$(systemctl show -P MainPID linstor-controller)/environ | grep -q '^LS_KEEP_RES='; then
          fail "the controller has the satellite's LS_KEEP_RES"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # SIGKILL is a failure for Restart=on-failure: systemd starts a new JVM, the node comes back online
    - name: Each JVM killed with SIGKILL is restarted by systemd
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        for u in linstor-controller linstor-satellite; do
          [ "$(systemctl show -P Restart $u)" = on-failure ] || fail "$u Restart: $(systemctl show -P Restart $u)"
          old=$(systemctl show -P MainPID $u); [ "$old" -gt 0 ] || fail "$u not running"
          kill -9 "$old"
          for i in $(seq 60); do
            new=$(systemctl show -P MainPID $u)
            [ "$new" -gt 0 ] && [ "$new" != "$old" ] && [ "$(systemctl is-active $u)" = active ] && break
            sleep 1
          done
          [ "$new" -gt 0 ] && [ "$new" != "$old" ] || fail "$u not restarted after kill -9: $(systemctl is-active $u)"
          [ "$(systemctl show -P NRestarts $u)" -ge 1 ] || fail "$u NRestarts $(systemctl show -P NRestarts $u)"
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: LINSTOR works under the caps, the node online
      ansible.builtin.shell: |
        set -o pipefail
        for i in $(seq 36); do
          n=$(linstor -m node list 2>&1) &&
            jq -e '.[0][] | select(.name == "linstor-node" and .connection_status == "ONLINE")' <<<"$n" > /dev/null && exit 0
          sleep 5
        done
        echo "FAIL: node: $n"; exit 1
      args:
        executable: /bin/bash
      changed_when: false
