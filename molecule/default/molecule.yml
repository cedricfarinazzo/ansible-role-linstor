---
dependency:
  # Into the scenario's ephemeral directory, put on the roles path below; never ~/.ansible
  name: shell
  command: >-
    sh -c 'ansible-galaxy collection install -r "$MOLECULE_SCENARIO_DIRECTORY/collections.yml"
    && ansible-galaxy role install --force -r "$MOLECULE_SCENARIO_DIRECTORY/requirements.yml"
    -p "$MOLECULE_EPHEMERAL_DIRECTORY/roles"'
driver:
  name: docker
platforms:
  # Name carries the distribution, so several distributions run side by side
  - name: linstor-${MOLECULE_DISTRO:-debian13}
    hostname: linstor-node
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    # Molecule does not add it: without it only a developer's ~/.ansible/roles hides the missing role
    ANSIBLE_ROLES_PATH: ${MOLECULE_EPHEMERAL_DIRECTORY}/roles
  playbooks:
    prepare: prepare/playbook.yml
    converge: converge/playbook.yml
    verify: verify/playbook.yml
    side_effect: side_effect/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
        # One combined node over mutual TLS, from the test CA made by prepare
        linstor_satellite: true
        linstor_controller: true
        linstor_tls: true
        linstor_tls_cert: /root/pki/node.crt
        linstor_tls_key: /root/pki/node.key
        linstor_tls_ca: /root/pki/ca.crt
        linstor_packages_extra:
          - drbd-reactor
        linstor_nodes:
          - name: linstor-node
            address: 127.0.0.1
            type: combined
        # A container has no LVM or ZFS: a file-backed thin pool
        linstor_storage_pools:
          - name: pool-test
            node: linstor-node
            provider: file_thin
            pool: /srv/linstor-pool
        linstor_resource_groups:
          - name: rg-test
            place_count: 1
            storage_pools:
              - pool-test
            drbd_options:
              PeerDevice/c-max-rate: 71680
            description: test group
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - destroy
